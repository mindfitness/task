<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SwiftDone - Minimal Todo</title>
    <style>
        :root {
            --bg: #f9f9f9;
            --text: #333;
            --accent: #007AFF;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            /* モバイルで上部に余白を確保しつつ、PCでも見やすく */
            padding-top: 10vh; 
            margin: 0;
            /* モバイルでのタップ時の青いハイライトを消す */
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        h1 {
            font-weight: 200;
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: -1px;
        }
        input {
            width: 100%;
            border: none;
            border-bottom: 2px solid #ddd;
            background: transparent;
            padding: 10px 0;
            font-size: 1.2rem;
            outline: none;
            transition: border-color 0.3s;
            /* iOSでのデフォルトの丸みを消す */
            border-radius: 0;
            appearance: none;
        }
        input:focus {
            border-color: var(--accent);
        }
        ul {
            list-style: none;
            padding: 0;
            margin-top: 30px;
        }
        li {
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            animation: fadeIn 0.3s ease;
            /* 長いテキストがはみ出さないように */
            word-break: break-all;
        }
        /* PCでのホバー効果 */
        @media (hover: hover) {
            li:hover {
                background: #fff;
                padding-left: 15px;
                color: #999;
            }
            li:hover::before {
                content: "✓";
                margin-right: 10px;
                color: var(--accent);
            }
        }
        /* モバイルでのアクティブ（タップ）状態の視覚フィードバック */
        li:active {
            background: #f0f0f0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Swift.</h1>
    <input type="text" id="todoInput" placeholder="次は何をする？" autofocus>
    <ul id="todoList">
    </ul>
</div>

<script>
    const input = document.getElementById('todoInput');
    const list = document.getElementById('todoList');

    input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && this.value.trim() !== "") {
            addTodo(this.value);
            this.value = "";
            // モバイルでキーボードを自動で閉じたい場合は以下を有効に（今回は連続入力を優先）
            // this.blur(); 
        }
    });

    function addTodo(text) {
        const li = document.createElement('li');
        li.textContent = text;
        
        // クリックで確認後に消去
        li.addEventListener('click', function() {
            // 確認ダイアログを表示
            const confirmDelete = confirm(`「${text}」のタスクを完了しますか？`);
            
            if (confirmDelete) {
                this.style.opacity = "0";
                this.style.transform = "translateX(20px)";
                setTimeout(() => {
                    this.remove();
                }, 200);
            }
        });

        list.prepend(li); 
    }
</script>

</body>
</html>
